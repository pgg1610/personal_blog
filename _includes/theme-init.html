<script>
// Apply the saved theme before paint; the light default also works without JS.
(() => {
  const root = document.documentElement;
  let theme = 'light';
  try {
    if (localStorage.getItem('theme') === 'dark') theme = 'dark';
  } catch { /* Storage can be unavailable in privacy-restricted browsers. */ }
  root.dataset.theme = theme;

  document.addEventListener('DOMContentLoaded', () => {
    const button = document.getElementById('theme-toggle');
    if (!button) return;

    const label = () => {
      const action = `Switch to ${root.dataset.theme === 'dark' ? 'light' : 'dark'} mode`;
      button.setAttribute('aria-label', action);
      button.title = action;
    };

    const apply = (next) => {
      root.dataset.theme = next;
      try { localStorage.setItem('theme', next); } catch { /* Still toggle. */ }
      label();
    };

    // The reveal grows from the button, so the new palette irises out to
    // cover the screen. The geometry is stored on :root for the CSS to read.
    const reveal = (next) => {
      const rect = button.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;
      const radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
      root.style.setProperty('--vt-x', `${x}px`);
      root.style.setProperty('--vt-y', `${y}px`);
      root.style.setProperty('--vt-r', `${radius}px`);
      document.startViewTransition(() => apply(next));
    };

    button.hidden = false;
    label();

    button.addEventListener('click', () => {
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (document.startViewTransition && !calm) {
        reveal(next);
      } else {
        root.dataset.themeTransition = '';
        apply(next);
      }
    });
  });
})();
</script>
