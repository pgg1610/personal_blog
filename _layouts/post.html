---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="eyebrow"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
    {% if page.tags and page.tags.size > 0 %}
      <ul class="tag-list" aria-label="Tags">
        {% for tag in page.tags %}
          <li><a href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">{{ tag }}</a></li>
        {% endfor %}
      </ul>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <p class="back-link"><a href="{{ '/blog/' | relative_url }}">← All writing</a></p>
</article>
